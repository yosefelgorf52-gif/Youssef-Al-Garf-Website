<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- مكتبة تشغيل البث المباشر -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #wrapper { position: relative; width: 100vw; height: 100vh; }
        
        /* شاشة الترحيب */
        #loader { 
            position: absolute; top:0; left:0; width:100%; height:100%; 
            background: #000; color: #e50914; display: flex; 
            justify-content: center; align-items: center; z-index: 100;
        }

        /* المشغل */
        video { width: 100%; height: 100%; background: #000; }

        /* القائمة السفلية الأفقية */
        #ui-layer { 
            position: absolute; bottom: 20px; left: 0; right: 0; 
            display: flex; justify-content: center; gap: 20px; 
            z-index: 50; opacity: 0; transition: opacity 0.3s;
        }
        .btn { padding: 10px 25px; background: rgba(0,0,0,0.7); border: 1px solid #e50914; color: white; border-radius: 50px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="wrapper">
        <div id="loader">جاري تحميل قناة الحدث...</div>
        <video id="video" controls autoplay playsinline></video>
        
        <div id="ui-layer">
            <button class="btn">الجودة: تلقائي</button>
            <button class="btn" onclick="location.reload()">تحديث البث</button>
        </div>
    </div>

<script>
    const video = document.getElementById('video');
    const videoSrc = 'http://alhadath-geo-live.hls.adaptive.level3.net/hls-live/alhadath-channel101/_definst_/live/stream1.m3u8';
    
    // إخفاء التحميل بعد 3 ثوانٍ
    setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 3000);

    // تفعيل المشغل
    if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
    } else {
        video.src = videoSrc;
    }

    // إظهار الواجهة عند الضغط
    document.getElementById('wrapper').addEventListener('click', () => {
        const ui = document.getElementById('ui-layer');
        ui.style.opacity = (ui.style.opacity == 1) ? 0 : 1;
    });
</script>

</body>
</html>
