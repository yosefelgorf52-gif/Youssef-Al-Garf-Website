<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #000; overflow: hidden; height: 100vh; width: 100vw; font-family: sans-serif; }
        #player-wrapper { position: relative; width: 100vw; height: 100vh; }

        /* مشغل جوجل درايف (في الخلفية) */
        iframe { width: 100%; height: 100%; border: none; position: absolute; z-index: 1; }

        /* واجهة الأزرار (الطبقة العلوية) */
        #overlay-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; 
                      background: rgba(0,0,0,0.5); display: flex; flex-direction: column; 
                      justify-content: space-between; padding: 20px; box-sizing: border-box; transition: opacity 0.3s; }
        .hidden { opacity: 0; pointer-events: none; }

        /* الأزرار */
        .btn-icon { background: rgba(255,255,255,0.1); border: none; border-radius: 50%; width: 50px; height: 50px; color: white; font-size: 20px; display: flex; align-items: center; justify-content: center; }
        
        .top-bar { display: flex; justify-content: space-between; }
        .center-controls { display: flex; justify-content: center; gap: 40px; align-items: center; }
        .bottom-bar { display: flex; justify-content: space-between; align-items: center; }
        
        /* رسالة التحميل */
        #loading-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                       color: white; font-size: 2rem; font-weight: bold; background: rgba(0,0,0,0.8); 
                       padding: 30px; border-radius: 15px; display: none; text-align: center; z-index: 20; }
    </style>
</head>
<body onclick="showUI()">

    <div id="player-wrapper">
        <!-- الفيديو -->
        <iframe src="https://drive.google.com/file/d/1cIqKbXCFqAo6s_XfzmUeAuo54bygE_Xm/preview" allowfullscreen></iframe>

        <!-- الواجهة الاحترافية -->
        <div id="overlay-ui">
            <div class="top-bar">
                <button class="btn-icon">←</button>
                <div style="display: flex; gap: 15px;">
                    <button class="btn-icon">📺</button>
                    <button class="btn-icon">⚙️</button>
                </div>
            </div>

            <div class="center-controls">
                <button class="btn-icon" style="width: 70px; height: 70px;">⟲ 5</button>
                <button class="btn-icon" style="width: 80px; height: 80px;">⏸</button>
                <button class="btn-icon" style="width: 70px; height: 70px;">15 ⟳</button>
            </div>

            <div class="bottom-bar">
                <div style="color: white;">00:00</div>
                <button class="btn-icon" onclick="triggerLoading()">⛶</button>
            </div>
        </div>

        <!-- رسالة التحميل -->
        <div id="loading-msg">Please wait...<br>جاري التحميل</div>
    </div>

    <script>
        let timeout;
        const overlay = document.getElementById('overlay-ui');
        
        // إظهار الأزرار
        function showUI() {
            overlay.classList.remove('hidden');
            clearTimeout(timeout);
            // إخفاء الأزرار بعد 3 ثواني
            timeout = setTimeout(() => { overlay.classList.add('hidden'); }, 3000);
        }

        // رسالة التحميل
        function triggerLoading() {
            const msg = document.getElementById('loading-msg');
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 2000);
        }

        // إخفاء تلقائي عند البداية
        showUI();
    </script>
</body>
</html>
