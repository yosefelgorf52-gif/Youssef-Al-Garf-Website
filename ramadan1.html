<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YG TV - Ultimate Engine</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body { margin: 0; background: #000; height: 100vh; overflow: hidden; }
        #player { width: 100%; height: 100%; }
        .plyr--video { height: 100vh !important; }
    </style>
</head>
<body>

    <video id="player" playsinline controls></video>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script>
        // 1. الرابط المباشر للفيلم
        const videoUrl = "https://drive.google.com/uc?export=download&id=1cIqKbXCFqAo6s_XfzmUeAuo54bygE_Xm";
        
        const player = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen', 'rewind', 'fast-forward'],
            fullscreen: { enabled: true, fallback: true, iosNative: true }
        });

        // 2. محرك التشغيل الجبار (Blob Engine) لتجاوز حظر جوجل
        async function loadVideo() {
            try {
                const response = await fetch(videoUrl);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                player.source = {
                    type: 'video',
                    sources: [{ src: blobUrl, type: 'video/mp4' }]
                };
            } catch (err) {
                console.error("خطأ في التحميل، جاري المحاولة مرة أخرى...", err);
                // إذا فشل، تشغيل الرابط مباشرة كخطة بديلة
                player.source = { type: 'video', sources: [{ src: videoUrl, type: 'video/mp4' }] };
            }
        }

        // 3. تدوير الشاشة أوتوماتيكياً
        player.on('play', () => {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
            player.fullscreen.enter();
        });

        loadVideo();
    </script>
</body>
</html>
