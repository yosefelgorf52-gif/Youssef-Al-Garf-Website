<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YG TV Player</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #video-container { width: 100vw; height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; }
        
        /* هنا يظهر رابط الفيديو الذي يعمل مع جوجل درايف */
        iframe { width: 100%; height: 100%; border: none; }

        /* طبقة الأزرار (تظهر عند الضغط) */
        #controls {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3); display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px; box-sizing: border-box;
            opacity: 0; transition: opacity 0.3s;
        }
        #controls.visible { opacity: 1; }

        /* الأزرار العلوية (الجودات) */
        .top-bar { display: flex; gap: 10px; }
        .btn-circle { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.2); color: white; border: none; }
        
        /* الأزرار السفلية (التحكم) */
        .bottom-bar { display: flex; justify-content: center; gap: 20px; color: white; }
    </style>
</head>
<body onclick="toggleControls()">

    <div id="video-container">
        <!-- هذا الرابط هو الوحيد الذي سيشغل فيديو درايف بشكل مباشر في إطار -->
        <iframe src="https://drive.google.com/file/d/1cIqKbXCFqAo6s_XfzmUeAuo54bygE_Xm/preview" allowfullscreen></iframe>
        
        <div id="controls">
            <div class="top-bar">
                <button class="btn-circle">HD</button>
                <button class="btn-circle">SD</button>
                <button class="btn-circle" style="background: red;">Low</button>
            </div>
            <div class="bottom-bar">
                <span>⏪</span> <span>⏸️</span> <span>⏩</span>
            </div>
        </div>
    </div>

    <script>
        function toggleControls() {
            document.getElementById('controls').classList.toggle('visible');
        }
    </script>
</body>
</html>
