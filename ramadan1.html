<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YG TV - Player Pro</title>
    <!-- مكتبة Plyr الاحترافية -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body { margin: 0; background: #000; overflow: hidden; height: 100vh; }
        .plyr--video { height: 100vh; width: 100vw; }
        
        /* تصميم الأزرار العلوية للجودات */
        .custom-ui { position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; gap: 10px; }
        .q-btn { background: rgba(0,0,0,0.6); color: white; border: 1px solid #ff0000; padding: 5px 15px; border-radius: 20px; font-size: 12px; }
    </style>
</head>
<body>

    <!-- أزرار الجودة -->
    <div class="custom-ui">
        <button class="q-btn">HD</button>
        <button class="q-btn">SD</button>
        <button class="q-btn" style="background: red;">Low</button>
    </div>

    <!-- مشغل الفيديو -->
    <video id="player" playsinline controls data-poster="https://i.imgur.com/your-poster.jpg">
        <source src="https://drive.google.com/uc?export=download&id=1cIqKbXCFqAo6s_XfzmUeAuo54bygE_Xm" type="video/mp4" />
    </video>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script>
        const player = new Plyr('#player', {
            controls: [
                'play-large', 'play', 'progress', 'current-time', 
                'mute', 'volume', 'settings', 'fullscreen', 'pip'
            ],
            settings: ['quality', 'speed'],
            autoplay: false,
            keyboard: { focused: true, global: true },
            fullscreen: { enabled: true, fallback: true, iosNative: true }
        });

        // تشغيل الوضع الأفقي تلقائياً عند الضغط على التشغيل
        player.on('play', () => {
            if (player.fullscreen.active === false) {
                player.fullscreen.enter();
            }
        });
    </script>
</body>
</html>
