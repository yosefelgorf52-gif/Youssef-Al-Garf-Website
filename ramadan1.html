<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YG TV - Hotel Desire</title>
    <!-- مكتبة الأسطورة (Plyr) -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body { margin: 0; background: #000; overflow: hidden; height: 100vh; width: 100vw; }
        
        /* إجبار المشغل على ملء الشاشة */
        .plyr--video { height: 100vh !important; width: 100vw !important; }
        
        /* رسالة التحميل */
        #loading-msg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: white; display: flex; 
            justify-content: center; align-items: center; z-index: 9999;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <!-- رسالة التحميل -->
    <div id="loading-msg">جاري تحميل الفيلم... يرجى الانتظار</div>

    <!-- المشغل -->
    <video id="player" playsinline controls>
        <!-- الرابط المباشر المستخرج من أرشيف -->
        <source src="https://archive.org/download/cimawbas.-tv.-hotel.-desire.-2011/cimawbas.tv.hotel.desire.2011.mp4" type="video/mp4" />
    </video>

    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    <script>
        const player = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen', 'rewind', 'fast-forward'],
            hideControls: true,
            fullscreen: { enabled: true, fallback: true, iosNative: true }
        });

        // إخفاء رسالة التحميل عند التشغيل
        player.on('playing', () => { 
            document.getElementById('loading-msg').style.display = 'none'; 
        });

        // إجبار التدوير التلقائي (Landscape) عند التشغيل
        player.on('play', () => {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
            player.fullscreen.enter();
        });

        // ضبط التقديم والتأخير
        player.rewind = 15;
        player.forward = 15;
    </script>
</body>
</html>
